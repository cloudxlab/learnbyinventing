chapter:
  id: logarithm
  title: "Logarithms"
  intro: |
    Logarithms sound intimidating, but you already understand them.
    You&rsquo;ll prove it to yourself in the next few minutes &mdash;
    starting with nothing more than counting zeros.
  mathjax: false
  footer: |
    You started by counting zeros. You ended with a working
    <code>my_log(value, base)</code> function and the change-of-base
    formula. Every time you see &ldquo;log&rdquo;, just ask:
    &ldquo;base to the power of <em>what</em> gives this number?&rdquo;
    That&rsquo;s all there is to it.

    **Going further:**

    - **Binary search:** Your brute-force <code>my_log</code> tries
      thousands of values. Binary search finds the answer in ~40 steps
      &mdash; see the Binary Search chapter on this site.
    - **Natural log (ln):** Base <em>e</em> &asymp; 2.718 appears
      everywhere in calculus and probability. Same idea, special base.
    - **Information theory:** log<sub>2</sub> measures how many
      yes/no questions you need to identify something &mdash;
      that&rsquo;s the basis of bits and entropy.
  glossary:
    - term: Logarithm
      definition: "The reverse of exponentiation: log_b(x) = y means b^y = x."
    - term: Base
      definition: "The number being raised to a power. In log₁₀, the base is 10; in log₂, it's 2."
    - term: Exponent / Power
      definition: "How many times the base is multiplied by itself: 10³ means 10 × 10 × 10."
    - term: Change of Base
      definition: "log_b(x) = log_a(x) / log_a(b) — convert any log to a different base."

blocks:
  # ═══════════════════════════════════════════════════
  # PART 1: Counting Zeros
  # ═══════════════════════════════════════════════════

  - type: part
    number: 1
    title: "Counting Zeros"
    estimated_time: "~5 min"
    intro: null

  # ── Slide 1: How many zeros? ─────────────────────
  - type: text
    text: |
      <style>
        .reveal .qa-stack { position: relative; min-height: 5em; }
        .reveal .qa-step  { position: absolute; top: 0; left: 0; right: 0; }
      </style>
      <div style="font-size:1.5em;">
        <p>Look at these numbers:</p>
        <table style="margin:0.5em auto; font-size:0.95em;">
          <tr><th style="padding:0.3em 1em;">Number</th><th style="padding:0.3em 1em;">How many zeros?</th></tr>
          <tr><td>10</td><td><span class="fragment fade-out" data-fragment-index="0">?</span><span class="fragment" data-fragment-index="0">1</span></td></tr>
          <tr><td>100</td><td><span class="fragment fade-out" data-fragment-index="1">?</span><span class="fragment" data-fragment-index="1">2</span></td></tr>
          <tr><td>1000</td><td><span class="fragment fade-out" data-fragment-index="2">?</span><span class="fragment" data-fragment-index="2">3</span></td></tr>
          <tr><td>10000</td><td><span class="fragment fade-out" data-fragment-index="3">?</span><span class="fragment" data-fragment-index="3">4</span></td></tr>
          <tr class="fragment" data-fragment-index="3"><td>100000</td><td><span class="fragment fade-out" data-fragment-index="4">?</span><span class="fragment" data-fragment-index="4">5</span></td></tr>
        </table>
        <div class="qa-stack">
          <p class="qa-step fragment fade-out" data-fragment-index="0"><strong>How many zeros does 10 have?</strong></p>
          <p class="qa-step fragment fade-in-then-out" data-fragment-index="0"><strong>How many zeros does 100 have?</strong></p>
          <p class="qa-step fragment fade-in-then-out" data-fragment-index="1"><strong>How many zeros does 1000 have?</strong></p>
          <p class="qa-step fragment fade-in-then-out" data-fragment-index="2"><strong>How many zeros does 10000 have?</strong></p>
          <p class="qa-step fragment fade-in-then-out" data-fragment-index="3"><strong>How many zeros does 100000 have?</strong></p>
          <p class="qa-step fragment" data-fragment-index="4">
            <span style="color:#2a7a2a;">&#10003; Easy!</span>
            The &ldquo;number of zeros&rdquo; has a fancy name: <strong>logarithm base 10</strong>.
          </p>
        </div>
      </div>

  # ── Slide 2: Powers of 10 ───────────────────────
  - type: text
    text: |
      <div style="font-size:1.5em;">
        <p>In Python, <code>**</code> is the power operator. <code>10**2</code> means
        &ldquo;10 to the power of 2&rdquo;.</p>
        <table style="margin:0.5em auto; font-size:0.95em;">
          <tr><th style="padding:0.3em 0.8em;">Expression</th><th style="padding:0.3em 0.8em;">Value</th><th style="padding:0.3em 0.8em;">Zeros</th></tr>
          <tr><td><code>10**1</code></td><td>10</td><td>1</td></tr>
          <tr><td><code>10**2</code></td><td>100</td><td>2</td></tr>
          <tr><td><code>10**3</code></td><td>1000</td><td>3</td></tr>
          <tr><td><code>10**4</code></td><td>10000</td><td>4</td></tr>
        </table>
        <div class="fragment" data-fragment-index="0">
          <p>The <strong>power</strong> tells you how many zeros.
          The <strong>number of zeros</strong> tells you the power.</p>
          <p>Going from power &rarr; number is <strong>exponentiation</strong>.<br/>
          Going from number &rarr; power is <strong>logarithm</strong>.</p>
        </div>
      </div>

  # ── Slide 3: Name the operation ──────────────────
  - type: text
    text: |
      <div style="font-size:1.5em;">
        <p>So when someone asks &ldquo;what is log<sub>10</sub>(1000)?&rdquo; they are asking:</p>
        <p style="text-align:center; font-size:1.1em; color:#7a6b3a;">
          <strong>10 to the power of <em>what</em> gives 1000?</strong>
        </p>
        <div class="fragment" data-fragment-index="0">
          <p style="text-align:center; color:#2a7a2a; font-size:1.1em;">Answer: <strong>3</strong>, because 10<sup>3</sup> = 1000.</p>
        </div>
        <div class="fragment" data-fragment-index="1">
          <p>That&rsquo;s it. That&rsquo;s all a logarithm is.</p>
          <table style="margin:0.5em auto; font-size:0.85em;">
            <tr><th style="padding:0.2em 0.8em;">log<sub>10</sub>(?)</th><th style="padding:0.2em 0.8em;">Question</th><th style="padding:0.2em 0.8em;">Answer</th></tr>
            <tr><td>log<sub>10</sub>(10)</td><td>10<sup>?</sup> = 10</td><td>1</td></tr>
            <tr><td>log<sub>10</sub>(100)</td><td>10<sup>?</sup> = 100</td><td>2</td></tr>
            <tr><td>log<sub>10</sub>(1000)</td><td>10<sup>?</sup> = 1000</td><td>3</td></tr>
            <tr><td>log<sub>10</sub>(10000)</td><td>10<sup>?</sup> = 10000</td><td>4</td></tr>
          </table>
        </div>
      </div>

  # ═══════════════════════════════════════════════════
  # PART 2: The Power Question
  # ═══════════════════════════════════════════════════

  - type: part
    number: 2
    title: "The Power Question"
    estimated_time: "~10 min"
    intro: null

  # ── Slide 4: Quick fire ──────────────────────────
  - type: text
    text: |
      <div style="font-size:1.5em;">
        <p><strong>Quick fire:</strong> answer without Python.</p>
        <div class="qa-stack">
          <div class="qa-step fragment fade-out" data-fragment-index="0">
            <p>10 to the power of <em>what</em> gives <strong>100</strong>?</p>
          </div>
          <div class="qa-step fragment fade-in-then-out" data-fragment-index="0">
            <p style="color:#2a7a2a;">&#10003; <strong>2</strong>, because 10<sup>2</sup> = 100.</p>
            <p>10 to the power of <em>what</em> gives <strong>10</strong>?</p>
          </div>
          <div class="qa-step fragment fade-in-then-out" data-fragment-index="1">
            <p style="color:#2a7a2a;">&#10003; <strong>1</strong>, because 10<sup>1</sup> = 10.</p>
            <p>10 to the power of <em>what</em> gives <strong>1</strong>?</p>
            <p style="font-size:0.8em;">(Tricky! What happens with power 0?)</p>
          </div>
          <div class="qa-step fragment fade-in-then-out" data-fragment-index="2">
            <p style="color:#2a7a2a;">&#10003; <strong>0</strong>, because 10<sup>0</sup> = 1. (Any number to the power of 0 is 1!)</p>
            <p>So log<sub>10</sub>(1) = ?</p>
          </div>
          <div class="qa-step fragment" data-fragment-index="3">
            <p style="color:#2a7a2a;">&#10003; <strong>log<sub>10</sub>(1) = 0</strong></p>
            <p>Key fact: <strong>log of 1 is always 0</strong>, no matter what the base is.</p>
          </div>
        </div>
      </div>

  # ── Slide 5: What about 500? ─────────────────────
  - type: text
    text: |
      <div style="font-size:1.5em;">
        <p>What is log<sub>10</sub>(500)?</p>
        <div class="fragment" data-fragment-index="0">
          <p>You know: log<sub>10</sub>(100) = 2 and log<sub>10</sub>(1000) = 3.</p>
          <p>So log<sub>10</sub>(500) must be <strong>between 2 and 3</strong>. But where exactly?</p>
        </div>
        <div class="fragment" data-fragment-index="1">
          <p><strong>Hit-and-trial</strong> &mdash; try values of x until <code>10**x</code> gets close to 500:</p>
          <table style="margin:0.5em auto; font-size:0.85em;">
            <tr><th style="padding:0.2em 0.6em;">x</th><th style="padding:0.2em 0.6em;">10<sup>x</sup></th><th style="padding:0.2em 0.6em;"></th></tr>
            <tr><td>2.5</td><td>316</td><td>too small</td></tr>
            <tr class="fragment" data-fragment-index="2"><td>2.7</td><td>501</td><td>very close!</td></tr>
            <tr class="fragment" data-fragment-index="3"><td>2.69</td><td>490</td><td>a bit under</td></tr>
            <tr class="fragment" data-fragment-index="4"><td>2.699</td><td>500.3</td><td style="color:#2a7a2a;">&#10003; almost!</td></tr>
          </table>
        </div>
        <div class="fragment" data-fragment-index="5">
          <p>Verify: <code>import math; math.log10(500)</code> &rarr; <strong>2.6990</strong></p>
        </div>
      </div>

  # ── Slide 6: Pattern — multiply by 10 ───────────
  - type: text
    text: |
      <div style="font-size:1.5em;">
        <p>Look at this pattern:</p>
        <table style="margin:0.5em auto; font-size:0.95em;">
          <tr><th style="padding:0.3em 1em;">Number</th><th style="padding:0.3em 1em;">log<sub>10</sub></th></tr>
          <tr><td>5</td><td><span class="fragment fade-out" data-fragment-index="0">?</span><span class="fragment" data-fragment-index="0">0.699</span></td></tr>
          <tr><td>50</td><td><span class="fragment fade-out" data-fragment-index="1">?</span><span class="fragment" data-fragment-index="1">1.699</span></td></tr>
          <tr><td>500</td><td>2.699</td></tr>
          <tr class="fragment" data-fragment-index="2"><td>5000</td><td><span class="fragment fade-out" data-fragment-index="3">?</span><span class="fragment" data-fragment-index="3">3.699</span></td></tr>
        </table>
        <div class="qa-stack">
          <p class="qa-step fragment fade-out" data-fragment-index="0"><strong>What is log<sub>10</sub>(5)?</strong> It&rsquo;s between 0 and 1. Try <code>10**0.7</code> in Python.</p>
          <p class="qa-step fragment fade-in-then-out" data-fragment-index="0"><strong>What is log<sub>10</sub>(50)?</strong> It&rsquo;s between 1 and 2.</p>
          <div class="qa-step fragment fade-in-then-out" data-fragment-index="1">
            <p><strong>Do you see the pattern?</strong></p>
          </div>
          <div class="qa-step fragment fade-in-then-out" data-fragment-index="2">
            <p><strong>What is log<sub>10</sub>(5000)?</strong> Predict it from the pattern!</p>
          </div>
          <div class="qa-step fragment" data-fragment-index="3">
            <p style="color:#2a7a2a;">&#10003; Every time you <strong>multiply by 10</strong>, the log goes up by <strong>exactly 1</strong>.</p>
            <p>That makes sense &mdash; you&rsquo;re adding one more power of 10!</p>
          </div>
        </div>
      </div>

  # ═══════════════════════════════════════════════════
  # PART 3: Beyond Base 10
  # ═══════════════════════════════════════════════════

  - type: part
    number: 3
    title: "Beyond Base 10"
    estimated_time: "~10 min"
    intro: null

  # ── Slide 7: Log base 2 ─────────────────────────
  - type: text
    text: |
      <div style="font-size:1.5em;">
        <p>There&rsquo;s nothing special about 10. Let&rsquo;s try <strong>base 2</strong>.</p>
        <p>log<sub>2</sub>(x) asks: <strong>2 to the power of <em>what</em> gives x?</strong></p>
        <table style="margin:0.5em auto; font-size:0.95em;">
          <tr><th style="padding:0.3em 0.8em;">Question</th><th style="padding:0.3em 0.8em;">log<sub>2</sub></th></tr>
          <tr><td>2<sup>?</sup> = 4</td><td><span class="fragment fade-out" data-fragment-index="0">?</span><span class="fragment" data-fragment-index="0">2</span></td></tr>
          <tr><td>2<sup>?</sup> = 8</td><td><span class="fragment fade-out" data-fragment-index="1">?</span><span class="fragment" data-fragment-index="1">3</span></td></tr>
          <tr><td>2<sup>?</sup> = 16</td><td><span class="fragment fade-out" data-fragment-index="2">?</span><span class="fragment" data-fragment-index="2">4</span></td></tr>
          <tr><td>2<sup>?</sup> = 32</td><td><span class="fragment fade-out" data-fragment-index="3">?</span><span class="fragment" data-fragment-index="3">5</span></td></tr>
          <tr class="fragment" data-fragment-index="3"><td>2<sup>?</sup> = 1024</td><td><span class="fragment fade-out" data-fragment-index="4">?</span><span class="fragment" data-fragment-index="4">10</span></td></tr>
        </table>
        <div class="qa-stack">
          <p class="qa-step fragment fade-out" data-fragment-index="0"><strong>log<sub>2</sub>(4) = ?</strong></p>
          <p class="qa-step fragment fade-in-then-out" data-fragment-index="0"><strong>log<sub>2</sub>(8) = ?</strong></p>
          <p class="qa-step fragment fade-in-then-out" data-fragment-index="1"><strong>log<sub>2</sub>(16) = ?</strong></p>
          <p class="qa-step fragment fade-in-then-out" data-fragment-index="2"><strong>log<sub>2</sub>(32) = ?</strong></p>
          <p class="qa-step fragment fade-in-then-out" data-fragment-index="3"><strong>log<sub>2</sub>(1024) = ?</strong> Computers love this one &mdash; 1 KB is 1024 bytes!</p>
          <p class="qa-step fragment" data-fragment-index="4" style="color:#2a7a2a;">&#10003; <strong>10</strong>, because 2<sup>10</sup> = 1024.</p>
        </div>
      </div>

  # ── Slide 8: Any base works ──────────────────────
  - type: text
    text: |
      <div style="font-size:1.5em;">
        <p>It works with <strong>any base</strong>. Same question every time:</p>
        <p style="text-align:center; font-size:1.05em; color:#7a6b3a;">
          <strong>base<sup>?</sup> = value</strong>
        </p>
        <table style="margin:0.5em auto; font-size:0.95em;">
          <tr><th style="padding:0.3em 0.8em;">Question</th><th style="padding:0.3em 0.8em;">Answer</th></tr>
          <tr><td>3<sup>?</sup> = 27</td><td><span class="fragment fade-out" data-fragment-index="0">?</span><span class="fragment" data-fragment-index="0">3</span></td></tr>
          <tr><td>5<sup>?</sup> = 125</td><td><span class="fragment fade-out" data-fragment-index="1">?</span><span class="fragment" data-fragment-index="1">3</span></td></tr>
          <tr><td>4<sup>?</sup> = 64</td><td><span class="fragment fade-out" data-fragment-index="2">?</span><span class="fragment" data-fragment-index="2">3</span></td></tr>
          <tr><td>7<sup>?</sup> = 1</td><td><span class="fragment fade-out" data-fragment-index="3">?</span><span class="fragment" data-fragment-index="3">0</span></td></tr>
        </table>
        <div class="qa-stack">
          <p class="qa-step fragment fade-out" data-fragment-index="0"><strong>log<sub>3</sub>(27) = ?</strong> &nbsp;3 &times; 3 &times; 3 = ?</p>
          <p class="qa-step fragment fade-in-then-out" data-fragment-index="0"><strong>log<sub>5</sub>(125) = ?</strong></p>
          <p class="qa-step fragment fade-in-then-out" data-fragment-index="1"><strong>log<sub>4</sub>(64) = ?</strong></p>
          <p class="qa-step fragment fade-in-then-out" data-fragment-index="2"><strong>log<sub>7</sub>(1) = ?</strong> &nbsp;Any number to the power of 0 is&hellip;</p>
          <div class="qa-step fragment" data-fragment-index="3">
            <p style="color:#2a7a2a;">&#10003; <strong>0</strong> &mdash; because anything<sup>0</sup> = 1.</p>
            <p>Verify in Python: <code>math.log(27, 3)</code> &rarr; 3.0, &nbsp;<code>math.log(125, 5)</code> &rarr; 3.0</p>
          </div>
        </div>
      </div>

  # ── Slide 9: Fractional logs ─────────────────────
  - type: text
    text: |
      <div style="font-size:1.5em;">
        <p>What is log<sub>2</sub>(6)?</p>
        <div class="fragment" data-fragment-index="0">
          <p>log<sub>2</sub>(4) = 2 and log<sub>2</sub>(8) = 3.
          Since 6 is between 4 and 8, the answer is <strong>between 2 and 3</strong>.</p>
        </div>
        <div class="fragment" data-fragment-index="1">
          <p><strong>Hit-and-trial:</strong></p>
          <table style="margin:0.5em auto; font-size:0.85em;">
            <tr><th style="padding:0.2em 0.6em;">x</th><th style="padding:0.2em 0.6em;">2<sup>x</sup></th><th style="padding:0.2em 0.6em;"></th></tr>
            <tr><td>2.5</td><td>5.66</td><td>too small</td></tr>
            <tr class="fragment" data-fragment-index="2"><td>2.6</td><td>6.06</td><td>tiny bit too big</td></tr>
            <tr class="fragment" data-fragment-index="3"><td>2.58</td><td>5.98</td><td>very close</td></tr>
            <tr class="fragment" data-fragment-index="4"><td>2.585</td><td>5.999</td><td style="color:#2a7a2a;">&#10003;</td></tr>
          </table>
        </div>
        <div class="fragment" data-fragment-index="5">
          <p>Verify: <code>math.log(6, 2)</code> &rarr; <strong>2.585</strong></p>
          <p>The answer doesn&rsquo;t have to be a whole number!</p>
        </div>
      </div>

  # ═══════════════════════════════════════════════════
  # PART 4: Build Your Own Log Function
  # ═══════════════════════════════════════════════════

  - type: part
    number: 4
    title: "Build Your Own Log Function"
    estimated_time: "~10 min"
    intro: null

  # ── Slide 10: Automate the trial ─────────────────
  - type: text
    text: |
      <style>
        .reveal .code-stack { position: relative; }
        .reveal .code-step  { position: absolute; top: 0; left: 0; right: 0; }
      </style>
      <div style="font-size:1.3em;">
        <p>You&rsquo;ve been doing hit-and-trial by hand. Make Python do it!</p>
        <p><strong>Write <code>my_log(value, base)</code></strong> that tries
        <code>x</code> from 0 to 20 in tiny steps (0.001) and returns the
        <code>x</code> where <code>base**x</code> is closest to <code>value</code>.</p>
        <div class="code-stack" style="min-height:14em;">
          <div class="code-step fragment fade-out" data-fragment-index="0">
      <pre><code>def my_log(value, base):
          best_x = 0
          best_diff = abs(value - 1)   # base**0 = 1
          x = 0
          while x &lt;= 20:
              diff = abs(base**x - value)
              if diff &lt; best_diff:
                  # update best_x and best_diff
                  pass
              x += 0.001
          return round(best_x, 3)</code></pre>
          </div>
          <div class="code-step fragment" data-fragment-index="0">
      <pre><code>def my_log(value, base):
          best_x = 0
          best_diff = abs(value - 1)
          x = 0
          while x &lt;= 20:
              diff = abs(base**x - value)
              if diff &lt; best_diff:
                  best_diff = diff
                  best_x = x
              x += 0.001
          return round(best_x, 3)</code></pre>
          </div>
        </div>
        <div class="fragment" data-fragment-index="1">
          <p style="font-size:0.9em;">
          <code>my_log(1000, 10)</code> &rarr; 3.0 &nbsp;&#10003; &nbsp;
          <code>my_log(8, 2)</code> &rarr; 3.0 &nbsp;&#10003; &nbsp;
          <code>my_log(6, 2)</code> &rarr; 2.585 &nbsp;&#10003;</p>
        </div>
      </div>

  # ── Slide 11: Test it ────────────────────────────
  - type: text
    text: |
      <div style="font-size:1.5em;">
        <p>Test your function against Python&rsquo;s built-in:</p>
        <table style="margin:0.5em auto; font-size:0.85em;">
          <tr><th style="padding:0.2em 0.6em;">Call</th><th style="padding:0.2em 0.6em;">my_log</th><th style="padding:0.2em 0.6em;">math.log</th><th style="padding:0.2em 0.6em;"></th></tr>
          <tr><td><code>my_log(1000, 10)</code></td><td>3.0</td><td>3.0</td><td>&#10003;</td></tr>
          <tr><td><code>my_log(500, 10)</code></td><td>2.699</td><td>2.699</td><td>&#10003;</td></tr>
          <tr><td><code>my_log(8, 2)</code></td><td>3.0</td><td>3.0</td><td>&#10003;</td></tr>
          <tr><td><code>my_log(6, 2)</code></td><td>2.585</td><td>2.585</td><td>&#10003;</td></tr>
          <tr><td><code>my_log(27, 3)</code></td><td>3.0</td><td>3.0</td><td>&#10003;</td></tr>
        </table>
        <div class="fragment" data-fragment-index="0">
          <p>It works! But it&rsquo;s slow &mdash; checking 20,000 values.</p>
          <p>The <strong>Binary Search</strong> chapter on this site finds the answer in
          just ~40 steps instead of 20,000. Same idea as your
          square-root guessing game!</p>
        </div>
      </div>

  # ═══════════════════════════════════════════════════
  # PART 5: The Change of Base Formula
  # ═══════════════════════════════════════════════════

  - type: part
    number: 5
    title: "The Change of Base Formula"
    estimated_time: "~5 min"
    intro: null

  # ── Slide 12: Discover change of base ────────────
  - type: text
    text: |
      <div style="font-size:1.5em;">
        <p>Python only gives you <code>math.log10()</code> and <code>math.log2()</code> built in.
        What if you need log base 3?</p>
        <div class="fragment" data-fragment-index="0">
          <p>Try this experiment &mdash; compute these ratios:</p>
          <table style="margin:0.5em auto; font-size:0.85em;">
            <tr><th style="padding:0.2em 0.6em;"></th><th style="padding:0.2em 0.6em;">log<sub>10</sub>(value)</th><th style="padding:0.2em 0.6em;">log<sub>10</sub>(base)</th><th style="padding:0.2em 0.6em;">ratio</th><th style="padding:0.2em 0.6em;">expected</th></tr>
            <tr><td>log<sub>3</sub>(27)</td><td>1.431</td><td>0.477</td><td><span class="fragment fade-out" data-fragment-index="1">?</span><span class="fragment" data-fragment-index="1">3.0</span></td><td>3</td></tr>
            <tr><td>log<sub>2</sub>(8)</td><td>0.903</td><td>0.301</td><td><span class="fragment fade-out" data-fragment-index="2">?</span><span class="fragment" data-fragment-index="2">3.0</span></td><td>3</td></tr>
            <tr><td>log<sub>5</sub>(125)</td><td>2.097</td><td>0.699</td><td><span class="fragment fade-out" data-fragment-index="3">?</span><span class="fragment" data-fragment-index="3">3.0</span></td><td>3</td></tr>
          </table>
        </div>
        <div class="qa-stack">
          <p class="qa-step fragment fade-in-then-out" data-fragment-index="1"><strong>Divide log<sub>10</sub>(value) by log<sub>10</sub>(base).</strong> What do you get?</p>
          <p class="qa-step fragment fade-in-then-out" data-fragment-index="2"><strong>Try the next one.</strong> Same pattern?</p>
          <div class="qa-step fragment" data-fragment-index="3">
            <p style="color:#2a7a2a;">&#10003; The ratio always gives the right answer!</p>
          </div>
        </div>
