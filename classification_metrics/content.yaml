      <pre><code>from sklearn.tree import DecisionTreeClassifier

      # Model 1: Logistic Regression
      model1 = LogisticRegression(max_iter=200)
      model1.fit(X_train, y_train)
      outputs1 = model1.predict_proba(X_test)[:, 1]

