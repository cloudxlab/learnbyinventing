  # ── Slide 15: ROC curve ──────────────────────────
  - type: text
    text: |
      <div style="font-size:1.3em;">
        <div style="display:flex; align-items:flex-start; gap:1.5em; justify-content:center;">
          <div style="flex:1; min-width:0;">
            <p>The <strong>ROC curve</strong> plots TPR (recall) vs FPR at various thresholds.</p>
            <p style="font-size:0.85em;">A perfect model hugs the top-left corner. A random model follows the diagonal.</p>
          </div>
          <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" style="max-width:180px; flex-shrink:0;">
            <line x1="30" y1="170" x2="190" y2="170" stroke="#999" stroke-width="1"/>
            <line x1="30" y1="170" x2="30" y2="10" stroke="#999" stroke-width="1"/>
            <text x="110" y="192" font-size="10" fill="#666" text-anchor="middle">FPR</text>
            <text x="12" y="90" font-size="10" fill="#666" text-anchor="middle" transform="rotate(-90 12,90)">TPR</text>
            <line x1="30" y1="170" x2="190" y2="10" stroke="#999" stroke-width="1" stroke-dasharray="4,4"/>
            <text x="148" y="60" font-size="9" fill="#999">random</text>
            <path d="M 30,170 C 30,50 90,10 190,10" stroke="#1565c0" stroke-width="2.5" fill="none"/>
            <path d="M 30,170 C 30,50 90,10 190,10 L 190,170 Z" fill="#1565c0" fill-opacity="0.08"/>
            <text x="120" y="130" font-size="10" fill="#1565c0">AUC</text>
          </svg>
        </div>
        <div class="fragment" data-fragment-index="0">
          <p>Write a function to compute and plot the ROC curve:</p>
      <pre><code>def plot_roc(actual, outputs, thresholds):
          # For each threshold: compute TPR, FPR
          # Plot TPR vs FPR + diagonal</code></pre>
        </div>
        <div class="fragment" data-fragment-index="1">
      <pre><code>def plot_roc(actual, outputs, thresholds):
          tprs, fprs = [], []
          for t in thresholds:
              pred = apply_threshold(outputs, t)
              tp, tn, fp, fn = confusion_matrix(actual, pred)
              tprs.append(tp / (tp+fn) if (tp+fn) > 0 else 0)
              fprs.append(fp / (fp+tn) if (fp+tn) > 0 else 0)
          plt.plot(fprs, tprs)
          plt.plot([0, 1], [0, 1], '--', color='gray')
          plt.xlabel('FPR'); plt.ylabel('TPR')
          plt.title('ROC Curve'); plt.show()
          return fprs, tprs</code></pre>
        </div>
      </div>

  # ── Slide 16: AUC calculation + significance ─────
  - type: text
    text: |
      <div style="font-size:1.3em;">
        <p>The <strong>Area Under the ROC Curve (AUC)</strong> summarizes model quality in a single number:</p>
        <ul style="font-size:0.9em;">
          <li><strong>AUC = 1.0</strong> &rarr; perfect classifier (never makes a mistake)</li>
          <li><strong>AUC = 0.5</strong> &rarr; random guessing (the diagonal line)</li>
          <li><strong>AUC &lt; 0.5</strong> &rarr; worse than random (flip predictions!)</li>
        </ul>
        <div class="fragment" data-fragment-index="0">
          <p>Write a function to approximate AUC using the trapezoidal rule:</p>
      <pre><code>def compute_auc(fprs, tprs):
          # Sort by FPR, then sum trapezoids</code></pre>
        </div>
        <div class="fragment" data-fragment-index="1">
      <pre><code>def compute_auc(fprs, tprs):
          pairs = sorted(zip(fprs, tprs))
          auc = 0
          for i in range(1, len(pairs)):
              dx = pairs[i][0] - pairs[i-1][0]
              avg_y = (pairs[i][1] + pairs[i-1][1]) / 2
              auc += dx * avg_y
          return auc</code></pre>
          <p style="font-size:0.85em;">The higher the AUC, the better the model separates the two classes &mdash;
          regardless of which threshold you pick.</p>
        </div>
      </div>

  # ── Slide 17: Compare two models ─────────────────
  - type: text
    text: |
