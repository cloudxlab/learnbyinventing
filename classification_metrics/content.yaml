      <pre><code>thresholds = [i / 100 for i in range(1, 100)]

      fprs1, tprs1 = plot_roc(actual, outputs1, thresholds)
      print("AUC Model 1:", compute_auc(fprs1, tprs1))

      fprs2, tprs2 = plot_roc(actual, outputs2, thresholds)
      print("AUC Model 2:", compute_auc(fprs2, tprs2))</code></pre>
          <p style="font-size:0.9em;">The model with the higher AUC is the better classifier!</p>
        </div>
