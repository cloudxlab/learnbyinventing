  # ── Slide 11: A tree by hand ─────────────────────
  - type: text
    text: |
      <div style="font-size:1.3em;">
        <p>Imagine deciding whether to accept a job offer:</p>
      <pre><code>Is salary > 1000?
      ├── NO  → Reject
      └── YES → Is distance &lt;= 40?
                 ├── YES → Accept
                 └── NO  → Reject</code></pre>
        <div class="fragment" data-fragment-index="0">
          <p><strong>Trace each case:</strong></p>
          <table style="margin:0.5em auto; font-size:0.85em;">
            <tr><th style="padding:0.2em 0.6em;">Salary</th><th style="padding:0.2em 0.6em;">Distance</th><th style="padding:0.2em 0.6em;">Result</th></tr>
            <tr><td>800</td><td>20</td><td><span class="fragment" data-fragment-index="1">salary &le; 1000 &rarr; <strong>Reject</strong></span></td></tr>
            <tr><td>1200</td><td>30</td><td><span class="fragment" data-fragment-index="2">salary &gt; 1000, dist &le; 40 &rarr; <strong>Accept</strong></span></td></tr>
            <tr><td>1500</td><td>60</td><td><span class="fragment" data-fragment-index="3">salary &gt; 1000, dist &gt; 40 &rarr; <strong>Reject</strong></span></td></tr>
          </table>
        </div>
        <div class="fragment" data-fragment-index="4">
          <p>This is a <strong>decision tree</strong>. It has two kinds of nodes:</p>
          <ul style="font-size:0.85em;">
            <li><strong>Boundary node:</strong> asks a question, has two children</li>
            <li><strong>Leaf node:</strong> gives a final answer</li>
          </ul>
        </div>
      </div>

  # ── Slide 12: Building the node class ────────────
  - type: text
    text: |
      <div style="font-size:1.3em;">
        <p>Design a class <code>DecisionTreeNode</code>:</p>
        <div class="code-stack" style="min-height:18em;">
          <div class="code-step fragment fade-out" data-fragment-index="0">
      <pre><code>class DecisionTreeNode:
          def __init__(self, decision=None, boundary=None,
                       boundary_value=None, left=None, right=None):
              # leaf: stores decision (a label)
              # boundary: stores feature name, threshold, left, right
              pass

          def check(self, features):
              # if leaf → return decision
              # else → compare features[boundary] to threshold
              #         go left or right
              pass

      def YES(): return DecisionTreeNode(decision=True)
      def NO():  return DecisionTreeNode(decision=False)</code></pre>
          </div>
          <div class="code-step fragment" data-fragment-index="0">
      <pre><code>class DecisionTreeNode:
          def __init__(self, decision=None, boundary=None,
                       boundary_value=None, left=None, right=None):
              self.decision = decision
              self.boundary = boundary
              self.boundary_value = boundary_value
              self.left = left
              self.right = right

          def check(self, features):
              if self.decision is not None:
                  return self.decision
              if features[self.boundary] &lt;= self.boundary_value:
                  return self.left.check(features)
              else:
                  return self.right.check(features)</code></pre>
          </div>
        </div>
      </div>

  # ── Slide 13: Build the job tree ─────────────────
  - type: text
    text: |
      <div style="font-size:1.3em;">
        <p>Build the job-offer tree by nesting nodes:</p>
      <pre><code>job_tree = DecisionTreeNode(
          boundary="salary", boundary_value=1000,
          left=NO(),                        # salary &lt;= 1000 → reject
          right=DecisionTreeNode(
              boundary="distance", boundary_value=40,
              left=YES(),                   # distance &lt;= 40 → accept
              right=NO()                    # distance > 40  → reject
          )
      )</code></pre>
        <div class="fragment" data-fragment-index="0">
      <pre><code>job_tree.check({"salary": 1200, "distance": 30})  # True ✓
      job_tree.check({"salary": 800,  "distance": 20})  # False ✓
      job_tree.check({"salary": 1500, "distance": 60})  # False ✓</code></pre>
          <p>The <code>check()</code> method <strong>traverses the tree recursively</strong>:
          at each boundary node it goes left or right, until it hits a leaf.</p>
        </div>
      </div>

