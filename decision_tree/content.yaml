  # ── Slide 19: Overfitting ────────────────────────
  - type: text
    text: |
      <div style="font-size:1.4em;">
        <p><strong>Is 100% training accuracy a good thing?</strong></p>
        <div class="fragment" data-fragment-index="0">
          <p>Not necessarily. The tree has <strong>memorized</strong> the training data
          &mdash; including its noise and outliers.</p>
          <svg viewBox="0 0 400 100" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;">
            <rect x="10" y="10" width="180" height="80" fill="#e8f5e9" rx="5"/>
            <text x="100" y="30" font-size="10" fill="#2e7d32" text-anchor="middle" font-weight="bold">Shallow tree</text>
            <text x="100" y="50" font-size="9" fill="#333" text-anchor="middle">Few splits, simple rules</text>
            <text x="100" y="65" font-size="9" fill="#333" text-anchor="middle">Training acc: 85%</text>
            <text x="100" y="80" font-size="9" fill="#2e7d32" text-anchor="middle">Test acc: 83% ✓</text>
            <rect x="210" y="10" width="180" height="80" fill="#ffebee" rx="5"/>
            <text x="300" y="30" font-size="10" fill="#c62828" text-anchor="middle" font-weight="bold">Deep tree</text>
            <text x="300" y="50" font-size="9" fill="#333" text-anchor="middle">Many splits, memorizes</text>
            <text x="300" y="65" font-size="9" fill="#333" text-anchor="middle">Training acc: 100%</text>
            <text x="300" y="80" font-size="9" fill="#c62828" text-anchor="middle">Test acc: 60% ✗</text>
          </svg>
        </div>
        <div class="fragment" data-fragment-index="1">
          <p>This is <strong>overfitting</strong>. Solutions:</p>
          <ul style="font-size:0.85em;">
            <li><strong>max_depth:</strong> stop splitting after N levels</li>
            <li><strong>min_samples:</strong> don&rsquo;t split groups smaller than K</li>
            <li><strong>Random Forest:</strong> build many trees on random subsets, take a vote</li>
          </ul>
        </div>
      </div>

