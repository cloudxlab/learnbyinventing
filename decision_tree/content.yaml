chapter:
  id: decision_tree
  title: "Decision Trees"
  intro: |
    You have a bag of mixed-up marbles. Some are red, some blue.
    You want to separate them. What&rsquo;s the best way to split
    the bag? You&rsquo;ll invent a measure of &ldquo;mixedness&rdquo;,
    use it to find the cleanest split, then discover that
    repeating this process builds a decision tree.
  colab_url: "https://colab.research.google.com/github/cloudxlab/learnbyinventing/blob/main/decision_tree/decision_tree.ipynb"
  mathjax: true
  footer: |
    You started with a bag of mixed marbles and a question:
    &ldquo;how mixed is this?&rdquo; You invented the impurity
    formula $4pq$, the greedy split search, recursive tree
    growth, and a full <code>fit</code>/<code>predict</code>
    interface. That is exactly how
    <code>sklearn.tree.DecisionTreeClassifier</code> works
    under the hood.

    **Going further:**

    - **Gini impurity:** Your $4pq$ is equivalent to the
      standard Gini formula $2pq$ &mdash; same rankings,
      different scale.
    - **Max depth / min samples:** Limit tree growth to
      prevent overfitting.
    - **Random Forests:** Build many trees on random subsets
      of data and features, then take a majority vote.
  glossary:
    - term: Impurity
      definition: "A number measuring how mixed a group is. Pure (all same label) = 0, maximally mixed (50/50) = 1."
    - term: Gini Impurity
      definition: "The standard impurity formula: 2p(1−p). Equivalent to our 4pq up to a constant factor."
    - term: Threshold
      definition: "A value that splits data into two groups: feature ≤ threshold goes left, feature > threshold goes right."
    - term: Decision Boundary
      definition: "The best (feature, threshold) pair — the split that minimizes total impurity."
    - term: Leaf Node
      definition: "A tree node with no children — it stores the final prediction (a label)."
    - term: Boundary Node
      definition: "A tree node with a splitting rule and two children (left and right subtrees)."
    - term: Overfitting
      definition: "When a model memorizes training data (including noise) and performs poorly on new data."

blocks:
  # ═══════════════════════════════════════════════════
  # PART 1: The Mixing Problem
  # ═══════════════════════════════════════════════════

  - type: part
    number: 1
    title: "The Mixing Problem"
    estimated_time: "~5 min"
    intro: null

  # ── Slide 1: Two bags of marbles ─────────────────
  - type: text
    text: |
      <div style="font-size:1.4em;">
        <p>You have two bags of marbles &mdash; red and blue:</p>
        <table style="margin:0.5em auto; font-size:0.95em;">
          <tr><th style="padding:0.3em 1em;">Bag</th><th style="padding:0.3em 1em;">Red</th><th style="padding:0.3em 1em;">Blue</th><th style="padding:0.3em 1em;">Total</th></tr>
          <tr><td>A</td><td style="color:#c62828;">10</td><td style="color:#1565c0;">0</td><td>10</td></tr>
          <tr><td>B</td><td style="color:#c62828;">5</td><td style="color:#1565c0;">5</td><td>10</td></tr>
        </table>
        <p><strong>Which bag is more &ldquo;mixed up&rdquo;?</strong></p>
        <div class="fragment" data-fragment-index="0">
          <p>Bag A has only red &mdash; it&rsquo;s <strong>pure</strong>.<br/>
          Bag B is half-and-half &mdash; it&rsquo;s <strong>maximally mixed</strong>.</p>
        </div>
        <div class="fragment" data-fragment-index="1">
          <p>Can you assign a <strong>number</strong> to &ldquo;how mixed&rdquo; a bag is?</p>
          <p style="font-size:0.85em;">The number should be <strong>0</strong> when the bag is pure
          and <strong>highest</strong> when it&rsquo;s 50/50.</p>
        </div>
      </div>

  # ── Slide 2: Inventing the impurity formula ──────
  - type: text
    text: |
      <div style="font-size:1.4em;">
        <p>Let $p$ = fraction of red, $q$ = fraction of blue, and $p + q = 1$.</p>
        <table style="margin:0.5em auto; font-size:0.9em;">
          <tr><th style="padding:0.2em 0.8em;">Bag</th><th style="padding:0.2em 0.8em;">p (red)</th><th style="padding:0.2em 0.8em;">q (blue)</th><th style="padding:0.2em 0.8em;">impurity(p, q) = ?</th></tr>
          <tr><td>A (all red)</td><td>1.0</td><td>0.0</td><td>should be <strong>0</strong></td></tr>
          <tr><td>B (all blue)</td><td>0.0</td><td>1.0</td><td>should be <strong>0</strong></td></tr>
          <tr><td>C (half-half)</td><td>0.5</td><td>0.5</td><td>should be <strong>1</strong></td></tr>
          <tr><td>D (mostly red)</td><td>0.8</td><td>0.2</td><td>should be between 0 and 1</td></tr>
        </table>
        <p><strong>Write a function that satisfies all four cases:</strong></p>
      <pre><code>def impurity(p, q):
          """p = fraction of red, q = fraction of blue, p + q = 1.
          Returns 0 when pure, 1 when maximally mixed."""
          return ???</code></pre>
        <div class="fragment" data-fragment-index="0">
          <p>Try $p \times q$:</p>
          <table style="margin:0.5em auto; font-size:0.9em;">
            <tr><td>A: 1.0 &times; 0.0 =</td><td><strong>0.00</strong> &check;</td></tr>
            <tr><td>B: 0.0 &times; 1.0 =</td><td><strong>0.00</strong> &check;</td></tr>
            <tr><td>C: 0.5 &times; 0.5 =</td><td><strong>0.25</strong> &mdash; not 1!</td></tr>
          </table>
          <p>Pure gives 0 &check; &mdash; but 50/50 gives 0.25, not 1.</p>
        </div>
        <div class="fragment" data-fragment-index="1">
          <p><strong>Fix:</strong> multiply by 4 &rarr; $\text{impurity} = 4pq$</p>
          <table style="margin:0.5em auto; font-size:0.9em;">
            <tr><td>A: 4 &times; 1.0 &times; 0.0 =</td><td><strong>0.0</strong> &check;</td></tr>
            <tr><td>B: 4 &times; 0.0 &times; 1.0 =</td><td><strong>0.0</strong> &check;</td></tr>
            <tr><td>C: 4 &times; 0.5 &times; 0.5 =</td><td><strong>1.0</strong> &check;</td></tr>
            <tr><td>D: 4 &times; 0.8 &times; 0.2 =</td><td><strong>0.64</strong> &check;</td></tr>
          </table>
        </div>
      </div>

  # ── Slide 3: The impurity curve ──────────────────
  - type: text
    text: |
      <div style="font-size:1.4em;">
        <div style="display:flex; align-items:flex-start; gap:1.5em; justify-content:center;">
          <div style="flex:1;">
            <p>Your impurity formula: $\;\text{impurity}(p) = 4p(1-p)$</p>
            <ul style="font-size:0.85em;">
              <li>$p = 0$ or $p = 1$ &rarr; <strong>0</strong> (pure)</li>
              <li>$p = 0.5$ &rarr; <strong>1</strong> (max mixed)</li>
              <li>Symmetric &mdash; it doesn&rsquo;t matter which color is &ldquo;p&rdquo;</li>
            </ul>
          </div>
          <svg viewBox="0 0 220 160" xmlns="http://www.w3.org/2000/svg" style="max-width:200px; flex-shrink:0;">
            <line x1="30" y1="140" x2="200" y2="140" stroke="#999" stroke-width="1"/>
            <line x1="30" y1="140" x2="30" y2="10" stroke="#999" stroke-width="1"/>
            <text x="30" y="155" font-size="8" fill="#666" text-anchor="middle">0</text>
            <text x="115" y="155" font-size="8" fill="#666" text-anchor="middle">0.5</text>
            <text x="200" y="155" font-size="8" fill="#666" text-anchor="middle">1</text>
            <text x="22" y="143" font-size="8" fill="#666" text-anchor="end">0</text>
            <text x="22" y="23" font-size="8" fill="#666" text-anchor="end">1</text>
            <text x="115" y="8" font-size="9" fill="#c62828" text-anchor="middle">4p(1&minus;p)</text>
            <text x="210" y="145" font-size="8" fill="#666">p</text>
            <polyline points="30,140 47,113 64,88 81,67 98,50 115,20 132,50 149,67 166,88 183,113 200,140" fill="none" stroke="#c62828" stroke-width="2.5"/>
          </svg>
        </div>
        <div class="fragment" data-fragment-index="0">
          <p>This is your <strong>impurity function</strong>. It measures how mixed a group is.</p>
          <p style="font-size:0.85em;">(The standard &ldquo;Gini impurity&rdquo; is $2pq$ &mdash; same shape, just scaled by &frac12;.
          Both rank splits identically.)</p>
        </div>
      </div>

  # ═══════════════════════════════════════════════════
  # PART 2: Splitting a List
  # ═══════════════════════════════════════════════════

  - type: part
    number: 2
    title: "Splitting a List"
    estimated_time: "~10 min"
    intro: null

  # ── Slide 4: Impurity of a list ──────────────────
  - type: text
    text: |
      <div style="font-size:1.4em;">
        <p>Given a list of labels, compute its impurity:</p>
      <pre><code>items = ["R", "R", "B", "R", "B"]</code></pre>
        <div class="fragment" data-fragment-index="0">
          <p>Count: 3 red, 2 blue &rarr; $p = 3/5 = 0.6$, $q = 2/5 = 0.4$</p>
          <p>$\text{impurity} = 4 \times 0.6 \times 0.4 = \mathbf{0.96}$</p>
        </div>
        <div class="fragment" data-fragment-index="1">
          <style>
            .reveal .code-stack { position: relative; }
            .reveal .code-step  { position: absolute; top: 0; left: 0; right: 0; }
          </style>
          <p><strong>Write a function</strong> <code>list_impurity(items)</code>:</p>
          <div class="code-stack" style="min-height:9em;">
            <div class="code-step fragment fade-out" data-fragment-index="2">
      <pre><code>def list_impurity(items):
          # count the most common label
          # p = count / total, q = 1 - p
          # return 4 * p * q
          pass</code></pre>
            </div>
            <div class="code-step fragment" data-fragment-index="2">
      <pre><code>def list_impurity(items):
          from collections import Counter
          c = Counter(items)
          most = c.most_common(1)[0][1]
          p = most / len(items)
          return 4 * p * (1 - p)</code></pre>
            </div>
          </div>
        </div>
      </div>

  # ── Slide 5: Splitting and total impurity ────────
  - type: text
    text: |
      <div style="font-size:1.4em;">
        <p>Now split a list into two halves and measure the <strong>total</strong> impurity:</p>
      <pre><code>items = ["R", "R", "B", "R", "B", "B", "B", "R"]</code></pre>
        <div class="fragment" data-fragment-index="0">
          <table style="margin:0.5em auto; font-size:0.9em;">
            <tr><th style="padding:0.2em 0.6em;">Split at</th><th style="padding:0.2em 0.6em;">Left</th><th style="padding:0.2em 0.6em;">Right</th><th style="padding:0.2em 0.6em;">Left imp.</th><th style="padding:0.2em 0.6em;">Right imp.</th></tr>
            <tr><td>position 3</td><td>[R, R, B]</td><td>[R, B, B, B, R]</td><td>0.89</td><td>0.96</td></tr>
            <tr><td>position 4</td><td>[R, R, B, R]</td><td>[B, B, B, R]</td><td>0.75</td><td>0.75</td></tr>
          </table>
        </div>
        <div class="fragment" data-fragment-index="1">
          <p><strong>Total impurity</strong> = weighted average:</p>
          <p style="font-size:0.95em;">
          $\text{total} = \dfrac{|L|}{|L|+|R|} \times \text{imp}(L) + \dfrac{|R|}{|L|+|R|} \times \text{imp}(R)$
          </p>
          <p style="font-size:0.9em;">
          Split at 3: $\frac{3}{8}(0.89) + \frac{5}{8}(0.96) = \mathbf{0.93}$<br/>
          Split at 4: $\frac{4}{8}(0.75) + \frac{4}{8}(0.75) = \mathbf{0.75}$ &larr; <strong>better!</strong>
          </p>
        </div>
        <div class="fragment" data-fragment-index="2">
          <p>The <strong>best split</strong> has the <strong>lowest total impurity</strong>.</p>
        </div>
      </div>

  # ── Slide 6: Find the best split position ────────
  - type: text
    text: |
      <div style="font-size:1.3em;">
        <p>Try every position and pick the one with minimum total impurity:</p>
        <div class="code-stack" style="min-height:14em;">
          <div class="code-step fragment fade-out" data-fragment-index="0">
      <pre><code>def total_impurity(left, right):
          n = len(left) + len(right)
          # weighted average of left and right impurity
          pass

      def find_best_split(items):
          # try every position from 1 to len-1
          # return the position with minimum total impurity
          pass</code></pre>
          </div>
          <div class="code-step fragment" data-fragment-index="0">
      <pre><code>def total_impurity(left, right):
          n = len(left) + len(right)
          wL = len(left) / n
          wR = len(right) / n
          return wL * list_impurity(left) + wR * list_impurity(right)

      def find_best_split(items):
          best_pos, min_imp = 0, float('inf')
          for i in range(1, len(items)):
              imp = total_impurity(items[:i], items[i:])
              if imp &lt; min_imp:
                  min_imp = imp
                  best_pos = i
          return best_pos, min_imp</code></pre>
          </div>
        </div>
        <div class="fragment" data-fragment-index="1">
          <p style="font-size:0.9em;">This is the core algorithm:
          <strong>try every split, keep the cleanest one</strong>.</p>
        </div>
      </div>

  # ═══════════════════════════════════════════════════
  # PART 3: Real Data — Height & Gender
  # ═══════════════════════════════════════════════════

  - type: part
    number: 3
    title: "Real Data — Height &amp; Gender"
    estimated_time: "~10 min"
    intro: null

  # ── Slide 7: The dataset ─────────────────────────
  - type: text
    text: |
      <div style="font-size:1.3em;">
        <p>20 students &mdash; each with a height (cm) and gender (M/F):</p>
      <pre><code>heights = [158, 162, 165, 167, 168, 170, 171, 172, 174, 175,
           176, 178, 179, 180, 181, 182, 183, 185, 187, 190]
      genders = ["F","F","F","F","M","F","M","M","F","M",
           "M","M","M","M","F","M","M","M","M","M"]</code></pre>
        <div class="fragment" data-fragment-index="0">
          <p><strong>Question:</strong> Can you predict gender from height?</p>
          <p>If you had to pick <strong>one height threshold</strong> to separate M from F,
          what would it be?</p>
        </div>
        <div class="fragment" data-fragment-index="1">
          <svg viewBox="0 0 440 70" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;">
            <line x1="20" y1="35" x2="420" y2="35" stroke="#ccc" stroke-width="1"/>
            <text x="20" y="65" font-size="7" fill="#666">158</text>
            <text x="420" y="65" font-size="7" fill="#666" text-anchor="end">190</text>
            <circle cx="32" cy="20" r="5" fill="#c62828"/><text x="32" y="13" font-size="6" fill="#c62828" text-anchor="middle">F</text>
            <circle cx="57" cy="20" r="5" fill="#c62828"/><text x="57" y="13" font-size="6" fill="#c62828" text-anchor="middle">F</text>
            <circle cx="76" cy="20" r="5" fill="#c62828"/><text x="76" y="13" font-size="6" fill="#c62828" text-anchor="middle">F</text>
            <circle cx="88" cy="20" r="5" fill="#c62828"/><text x="88" y="13" font-size="6" fill="#c62828" text-anchor="middle">F</text>
            <circle cx="95" cy="50" r="5" fill="#1565c0"/><text x="95" y="60" font-size="6" fill="#1565c0" text-anchor="middle">M</text>
            <circle cx="107" cy="20" r="5" fill="#c62828"/><text x="107" y="13" font-size="6" fill="#c62828" text-anchor="middle">F</text>
            <circle cx="114" cy="50" r="5" fill="#1565c0"/><text x="114" y="60" font-size="6" fill="#1565c0" text-anchor="middle">M</text>
            <circle cx="120" cy="50" r="5" fill="#1565c0"/><text x="120" y="60" font-size="6" fill="#1565c0" text-anchor="middle">M</text>
            <circle cx="133" cy="20" r="5" fill="#c62828"/><text x="133" y="13" font-size="6" fill="#c62828" text-anchor="middle">F</text>
            <circle cx="139" cy="50" r="5" fill="#1565c0"/><text x="139" y="60" font-size="6" fill="#1565c0" text-anchor="middle">M</text>
            <circle cx="145" cy="50" r="5" fill="#1565c0"/><text x="145" y="60" font-size="6" fill="#1565c0" text-anchor="middle">M</text>
            <circle cx="158" cy="50" r="5" fill="#1565c0"/><text x="158" y="60" font-size="6" fill="#1565c0" text-anchor="middle">M</text>
            <circle cx="164" cy="50" r="5" fill="#1565c0"/><text x="164" y="60" font-size="6" fill="#1565c0" text-anchor="middle">M</text>
            <circle cx="170" cy="50" r="5" fill="#1565c0"/><text x="170" y="60" font-size="6" fill="#1565c0" text-anchor="middle">M</text>
            <circle cx="183" cy="20" r="5" fill="#c62828"/><text x="183" y="13" font-size="6" fill="#c62828" text-anchor="middle">F</text>
            <circle cx="189" cy="50" r="5" fill="#1565c0"/><text x="189" y="60" font-size="6" fill="#1565c0" text-anchor="middle">M</text>
            <circle cx="195" cy="50" r="5" fill="#1565c0"/><text x="195" y="60" font-size="6" fill="#1565c0" text-anchor="middle">M</text>
            <circle cx="208" cy="50" r="5" fill="#1565c0"/><text x="208" y="60" font-size="6" fill="#1565c0" text-anchor="middle">M</text>
            <circle cx="220" cy="50" r="5" fill="#1565c0"/><text x="220" y="60" font-size="6" fill="#1565c0" text-anchor="middle">M</text>
            <circle cx="240" cy="50" r="5" fill="#1565c0"/><text x="240" y="60" font-size="6" fill="#1565c0" text-anchor="middle">M</text>
          </svg>
          <p style="font-size:0.85em;">Short heights are mostly <span style="color:#c62828;">F</span>,
          tall heights are mostly <span style="color:#1565c0;">M</span> &mdash; but there&rsquo;s overlap in the middle.</p>
        </div>
      </div>

  # ── Slide 8: Splitting by threshold ──────────────
  - type: text
    text: |
      <div style="font-size:1.3em;">
        <p>Instead of splitting at a <em>position</em>, split at a <strong>threshold value</strong>:</p>
        <ul style="font-size:0.9em;">
          <li><strong>Left group:</strong> height &le; threshold</li>
          <li><strong>Right group:</strong> height &gt; threshold</li>
        </ul>
        <div class="fragment" data-fragment-index="0">
          <p>Try threshold = 170:</p>
          <table style="margin:0.5em auto; font-size:0.85em;">
            <tr><th style="padding:0.2em 0.5em;">Group</th><th style="padding:0.2em 0.5em;">Heights</th><th style="padding:0.2em 0.5em;">Genders</th><th style="padding:0.2em 0.5em;">Impurity</th></tr>
            <tr><td>Left (&le;170)</td><td>158,162,165,167,168,170</td><td>F,F,F,F,M,F</td><td>0.56</td></tr>
            <tr><td>Right (&gt;170)</td><td>171&hellip;190</td><td>M,M,F,M,M,M,M,M,F,M,M,M,M,M</td><td>0.41</td></tr>
          </table>
          <p style="font-size:0.9em;">Total: $\frac{6}{20}(0.56) + \frac{14}{20}(0.41) = \mathbf{0.45}$</p>
        </div>
        <div class="fragment" data-fragment-index="1">
          <p>But is 170 the <strong>best</strong> threshold? Try them all!</p>
        </div>
      </div>

  # ── Slide 9: Find the best threshold ─────────────
  - type: text
    text: |
      <div style="font-size:1.3em;">
        <p><strong>Try every unique height</strong> as a threshold:</p>
        <div class="code-stack" style="min-height:14em;">
          <div class="code-step fragment fade-out" data-fragment-index="0">
      <pre><code>def split_by_threshold(heights, genders, t):
          left  = [g for h, g in zip(heights, genders) if h &lt;= t]
          right = [g for h, g in zip(heights, genders) if h > t]
          return left, right

      def find_best_threshold(heights, genders):
          best_t, min_imp = None, float('inf')
          for t in sorted(set(heights)):
              left, right = split_by_threshold(heights, genders, t)
              if not left or not right:
                  continue
              # compute total_impurity, track the best
              pass
          return best_t, min_imp</code></pre>
          </div>
          <div class="code-step fragment" data-fragment-index="0">
      <pre><code>def find_best_threshold(heights, genders):
          best_t, min_imp = None, float('inf')
          for t in sorted(set(heights)):
              left, right = split_by_threshold(heights, genders, t)
              if not left or not right:
                  continue
              imp = total_impurity(left, right)
              if imp &lt; min_imp:
                  min_imp = imp
                  best_t = t
          return best_t, min_imp

      best_t, best_imp = find_best_threshold(heights, genders)
      # best_t = 167 — left is pure [F,F,F,F], right is mostly M</code></pre>
          </div>
        </div>
        <div class="fragment" data-fragment-index="1">
          <p>The best threshold is <strong>height &le; 167</strong>.
          Left group: all F (pure!). Right group: mostly M with a few F outliers.</p>
        </div>
      </div>

  # ── Slide 10: Multiple features ──────────────────
  - type: text
    text: |
      <div style="font-size:1.3em;">
        <p>Now add a second feature &mdash; <strong>weight</strong>:</p>
      <pre><code style="font-size:0.85em;">data = [
          {"height": 158, "weight": 52, "gender": "F"},
          {"height": 162, "weight": 55, "gender": "F"},
          ...
          {"height": 190, "weight": 98, "gender": "M"},
      ]</code></pre>
        <div class="fragment" data-fragment-index="0">
          <p><strong>Which feature separates M from F better &mdash; height or weight?</strong></p>
          <p>Try every (feature, threshold) pair:</p>
        </div>
        <div class="fragment" data-fragment-index="1">
          <div class="code-stack" style="min-height:12em;">
            <div class="code-step fragment fade-out" data-fragment-index="2">
      <pre><code>def find_decision_boundary(data, features, label):
          best_feature, best_threshold = None, None
          min_imp = float('inf')
          for feature in features:
              for t in sorted(set(row[feature] for row in data)):
                  left  = [row[label] for row in data if row[feature] &lt;= t]
                  right = [row[label] for row in data if row[feature] > t]
                  if not left or not right:
                      continue
                  # track the best (feature, threshold, impurity)
          return best_feature, best_threshold, min_imp</code></pre>
            </div>
            <div class="code-step fragment" data-fragment-index="2">
      <pre><code>def find_decision_boundary(data, features, label):
          best_feature, best_threshold = None, None
          min_imp = float('inf')
          for feature in features:
              for t in sorted(set(row[feature] for row in data)):
                  left  = [row[label] for row in data if row[feature] &lt;= t]
                  right = [row[label] for row in data if row[feature] > t]
                  if not left or not right:
                      continue
                  imp = total_impurity(left, right)
                  if imp &lt; min_imp:
                      min_imp = imp
                      best_feature = feature
                      best_threshold = t
          return best_feature, best_threshold, min_imp
      # weight wins — it separates M/F more cleanly!</code></pre>
            </div>
          </div>
        </div>
      </div>

