  # ── Slide 14: What happens after the first split ─
  - type: text
    text: |
      <div style="font-size:1.4em;">
        <p>After the first split on height &le; 167:</p>
      <pre><code style="font-size:0.85em;">height &lt;= 167
      ├── Left:  [F, F, F, F]           ← pure! → LEAF: F
      └── Right: [M, F, M, M, F, M, M, M, M, M, F, M, M, M, M, M]
                                         ← still mixed!</code></pre>
        <div class="fragment" data-fragment-index="0">
          <p>The right group is impure. <strong>What do you do?</strong></p>
          <p class="fragment" data-fragment-index="1"><strong>Split it again!</strong>
          Find the best threshold in the right group, split, repeat.</p>
        </div>
        <div class="fragment" data-fragment-index="2">
          <p><strong>Stop when:</strong></p>
          <ul style="font-size:0.9em;">
            <li>The group is <strong>pure</strong> (all same label)</li>
            <li>The group has <strong>1 element</strong></li>
            <li>At the leaf, predict the <strong>majority label</strong></li>
          </ul>
        </div>
        <div class="fragment" data-fragment-index="3">
          <p>This is <strong>recursion</strong> &mdash; the same algorithm applied
          to smaller and smaller subsets.</p>
        </div>
      </div>

  # ── Slide 15: build_tree ─────────────────────────
  - type: text
    text: |
      <div style="font-size:1.2em;">
        <p><strong><code>build_tree(data, features, label)</code></strong> &mdash; the recursive algorithm:</p>
        <div class="code-stack" style="min-height:20em;">
          <div class="code-step fragment fade-out" data-fragment-index="0">
      <pre><code>def majority_label(labels):
          # return the most common label
          pass

      def is_pure(labels):
          # return True if all labels are the same
          pass

      def build_tree(data, features, label):
          labels = [row[label] for row in data]
          # Base case: pure or single element → return leaf
          # Recursive case:
          #   find_decision_boundary → best feature, threshold
          #   split data into left_data, right_data
          #   build_tree(left_data), build_tree(right_data)
          #   return boundary node
          pass</code></pre>
          </div>
          <div class="code-step fragment" data-fragment-index="0">
      <pre><code>def majority_label(labels):
          from collections import Counter
          return Counter(labels).most_common(1)[0][0]

      def is_pure(labels):
          return len(set(labels)) &lt;= 1

      def build_tree(data, features, label):
          labels = [row[label] for row in data]
          if len(data) &lt;= 1 or is_pure(labels):
              return DecisionTreeNode(decision=majority_label(labels))
          feat, thresh, _ = find_decision_boundary(data, features, label)
          left_data  = [r for r in data if r[feat] &lt;= thresh]
          right_data = [r for r in data if r[feat] >  thresh]
          if not left_data or not right_data:
              return DecisionTreeNode(decision=majority_label(labels))
          return DecisionTreeNode(
              boundary=feat, boundary_value=thresh,
              left=build_tree(left_data, features, label),
              right=build_tree(right_data, features, label))</code></pre>
          </div>
        </div>
      </div>

