  - type: part
    number: 1
    title: "The Prediction Problem"
    estimated_time: "~15 min"
    intro: null

  - type: text
    text: |
      <style>
        .reveal .phase-container { position: relative; min-height: 18em; }
        .reveal .phase-intro, .reveal .phase-qa { position: absolute; top: 0; left: 0; right: 0; font-size: 1.6em; }
        .reveal .qa-stack { position: relative; min-height: 5em; }
        .reveal .qa-step  { position: absolute; top: 0; left: 0; right: 0; }
      </style>
      <div class="phase-container">
        <div class="phase-intro fragment fade-out" data-fragment-index="0" style="text-align:center;">
          <svg viewBox="0 0 300 100" xmlns="http://www.w3.org/2000/svg" style="max-width:500px; width:100%; margin:0 auto; display:block;">
            <text x="15" y="58" font-size="22" font-family="Georgia,serif" fill="#333">x</text>
            <line x1="40" y1="50" x2="85" y2="50" stroke="#888" stroke-width="2"/>
            <polygon points="85,45 95,50 85,55" fill="#888"/>
            <rect x="95" y="20" width="110" height="60" rx="8" fill="#f5f3ef" stroke="#c8a96e" stroke-width="2"/>
            <text x="150" y="58" font-size="28" font-family="Georgia,serif" fill="#7a6b3a" text-anchor="middle">?</text>
            <line x1="205" y1="50" x2="250" y2="50" stroke="#888" stroke-width="2"/>
            <polygon points="250,45 260,50 250,55" fill="#888"/>
            <text x="270" y="58" font-size="22" font-family="Georgia,serif" fill="#333">y</text>
          </svg>
          <p>There's a mystery box. You feed it a number <strong>x</strong> and it gives back a number <strong>y</strong>. You tried it twice:</p>
          <table style="margin:0.5em auto;">
            <tr><th>x</th><th>y</th></tr>
            <tr><td>1</td><td>3</td></tr>
            <tr><td>2</td><td>7</td></tr>
          </table>
        </div>
        <div class="phase-qa fragment" data-fragment-index="0" style="width:100%;">
          <div style="display:flex; align-items:flex-start; gap:2em; justify-content:center; width:100%;">
            <div>
              <svg viewBox="0 0 300 100" xmlns="http://www.w3.org/2000/svg" style="max-width:280px;">
                <text x="15" y="58" font-size="22" font-family="Georgia,serif" fill="#333">x</text>
                <line x1="40" y1="50" x2="85" y2="50" stroke="#888" stroke-width="2"/>
                <polygon points="85,45 95,50 85,55" fill="#888"/>
                <rect x="95" y="20" width="110" height="60" rx="8" fill="#f5f3ef" stroke="#c8a96e" stroke-width="2"/>
                <text x="150" y="58" font-size="28" font-family="Georgia,serif" fill="#7a6b3a" text-anchor="middle">?</text>
                <line x1="205" y1="50" x2="250" y2="50" stroke="#888" stroke-width="2"/>
                <polygon points="250,45 260,50 250,55" fill="#888"/>
                <text x="270" y="58" font-size="22" font-family="Georgia,serif" fill="#333">y</text>
              </svg>
              <table style="margin-top:0.5em;">
                <tr><th>x</th><th>y</th></tr>
                <tr><td>1</td><td>3</td></tr>
                <tr><td>2</td><td>7</td></tr>
                <tr><td>3</td><td><span class="fragment fade-out" data-fragment-index="1">?</span><span class="fragment" data-fragment-index="1">11</span></td></tr>
                <tr class="fragment" data-fragment-index="1"><td>2.5</td><td><span class="fragment fade-out" data-fragment-index="2">?</span><span class="fragment" data-fragment-index="2">9</span></td></tr>
                <tr class="fragment" data-fragment-index="2"><td>2.1</td><td><span class="fragment fade-out" data-fragment-index="3">?</span><span class="fragment" data-fragment-index="3">7.4</span></td></tr>
                <tr class="fragment" data-fragment-index="3"><td>0</td><td><span class="fragment fade-out" data-fragment-index="4">?</span><span class="fragment" data-fragment-index="4">&minus;1</span></td></tr>
                <tr class="fragment" data-fragment-index="4"><td>0.5</td><td><span class="fragment fade-out" data-fragment-index="5">?</span><span class="fragment" data-fragment-index="5">1</span></td></tr>
                <tr class="fragment" data-fragment-index="5"><td>x<sub>1</sub></td><td><span class="fragment fade-out" data-fragment-index="6">?</span><span class="fragment" data-fragment-index="6">4x<sub>1</sub> &minus; 1</span></td></tr>
              </table>
            </div>
            <div style="text-align:left; flex:1; min-width:0;">
              <div class="qa-stack">
                <p class="qa-step fragment fade-out" data-fragment-index="1"><strong>How much will y be when x&nbsp;=&nbsp;3?</strong></p>
                <div class="qa-step fragment fade-in-then-out" data-fragment-index="1">
                  <p style="color:#2a7a2a;">&#10003; <strong>y&nbsp;=&nbsp;11!</strong> When x goes up by 1, y goes up by 4.</p>
                  <p><strong>How much when x&nbsp;=&nbsp;2.5?</strong></p>
                </div>
                <div class="qa-step fragment fade-in-then-out" data-fragment-index="2">
                  <p style="color:#2a7a2a;">&#10003; <strong>y&nbsp;=&nbsp;9!</strong> Half a step in x &rarr; half the increase.</p>
                  <p><strong>What about x&nbsp;=&nbsp;2.1?</strong></p>
                </div>
                <div class="qa-step fragment fade-in-then-out" data-fragment-index="3">
                  <p style="color:#2a7a2a;">&#10003; <strong>y&nbsp;=&nbsp;7.4!</strong> Just 0.1 past x&nbsp;=&nbsp;2, so 7&nbsp;+&nbsp;0.4.</p>
                  <p><strong>Now try x&nbsp;=&nbsp;0.</strong></p>
                </div>
                <div class="qa-step fragment fade-in-then-out" data-fragment-index="4">
                  <p style="color:#2a7a2a;">&#10003; <strong>y&nbsp;=&nbsp;&minus;1!</strong> Going back from x&nbsp;=&nbsp;1 subtracts 4.</p>
                  <p><strong>What about x&nbsp;=&nbsp;0.5?</strong></p>
                </div>
                <div class="qa-step fragment fade-in-then-out" data-fragment-index="5">
                  <p style="color:#2a7a2a;">&#10003; <strong>y&nbsp;=&nbsp;1!</strong> Halfway between &minus;1 and 3.</p>
                  <p><strong>For any x<sub>1</sub>, can you write y&nbsp;=&nbsp;?</strong></p>
                </div>
                <div class="qa-step fragment" data-fragment-index="6">
                  <p style="font-size:1.3em; color:#7a6b3a; margin-top:0.5em;"><strong>y&nbsp;=&nbsp;4x&nbsp;&minus;&nbsp;1</strong></p>
                  <p>You just discovered a <em>linear function</em>!</p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

