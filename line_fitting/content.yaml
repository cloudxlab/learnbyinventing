chapter:
  id: line_fitting
  title: "Line Fitting & Curve Fitting"
  intro: |
    Given a few data points, can you predict what comes next? You'll start
    with a simple question, discover the formula hiding in the data, and
    build your way to fitting lines and curves to anything.
  mathjax: true
  footer: |
    You started with two data points and a guess. You ended with functions
    that fit lines and curves to any data — and a way to measure which fit
    is better. This is the foundation of regression, one of the most
    important tools in machine learning.

    **Going further:**

    - **More features:** What if y depends on two inputs (x₁ and x₂)?
      That's multiple linear regression — same idea, more dimensions.
    - **Gradient descent:** For complex models, solving for the best
      parameters directly gets hard. Gradient descent finds them
      iteratively — see the Gradient Descent chapter on this site.
    - **Overfitting:** A high-degree polynomial fits your data perfectly
      but predicts terribly on new data. How do you know when you've
      gone too far?
  glossary:
    - term: Slope (m)
      definition: "How much y changes when x increases by 1 — the steepness of the line."
    - term: Intercept (c)
      definition: "The value of y when x = 0 — where the line crosses the y-axis."
    - term: Linear function
      definition: "A function of the form y = mx + c — it draws a straight line."
    - term: Residual
      definition: "The difference between an actual y value and the predicted y value."
    - term: Mean Squared Error (MSE)
      definition: "The average of the squared residuals — measures how well a model fits the data."
    - term: Polynomial
      definition: "A function like y = ax² + bx + c — uses powers of x to fit curves."
    - term: Overfitting
      definition: "Using too many parameters so the model memorizes the data instead of learning the pattern."

